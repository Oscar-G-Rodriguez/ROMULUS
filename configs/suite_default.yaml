backtest:
  name: "ROMULUS Suite Default"
  start_date: "2010-01-01"
  end_date: "2024-12-31"
  initial_cash: 10000.0

universe:
  source: "configs/universe_default.json"

strategies:
  - name: "equal_weight"
    type: "equal_weight"
  - name: "cash_only"
    type: "cash_only"
  - name: "buy_and_hold"
    type: "buy_and_hold"
  - name: "inv_vol"
    type: "inv_vol"
  - name: "ts_mom"
    type: "ts_mom"
  - name: "xsec_mom"
    type: "xsec_mom"
  - name: "vol_target"
    type: "vol_target"
  - name: "ma_crossover"
    type: "ma_crossover"
  - name: "ml_return_xgb"
    type: "ml_return"
    params:
      model_family: "xgboost"
      device: "auto"
      refit_frequency: "every_n_decisions"
      refit_n: 8
      xgb_params: {n_estimators: 100}
  - name: "ml_vol_xgb"
    type: "ml_vol"
    params:
      model_family: "xgboost"
      device: "auto"
      refit_frequency: "every_n_decisions"
      refit_n: 8
      xgb_params: {n_estimators: 100}
  - name: "ml_rar_xgb"
    type: "ml_risk_adjusted"
    params:
      model_family: "xgboost"
      device: "auto"
      refit_frequency: "every_n_decisions"
      refit_n: 8
      xgb_params: {n_estimators: 100}
  - name: "ml_rar_ridge"
    type: "ml_risk_adjusted"
    params:
      model_family: "ridge"
      device: "cpu"

execution:
  decision_days: ["wednesday", "friday"]
  decision_time: "close"
  fill_time: "open"
  fractional_shares: true
  min_order_notional: 1.0
  cash_buffer_pct: 0.01
  max_weight: 0.35
  turnover_cap: 0.35

costs:
  commission_per_trade: 0.0
  slippage_bps: 5.0

data:
  source: "yfinance"
  cache_dir: "data/cache"
  adjustment: "split_and_dividend"
  coverage_policy: "dynamic"

output:
  run_dir: "outputs/suite_runs"

warmup:
  enabled: true
  start_date: "2008-01-01"
  rebase: true

leaderboard:
  window: 20
  dd_limit: -0.2
  turnover_limit: 1.0
  regime_min_periods: 4
  global_weight: 0.60
  regime_weight: 0.40

meta:
  enabled: true
  min_periods_before_selection: 4
  baseline_strategy: "equal_weight"
  selection_day: "friday"
  switch_margin: 0.10

ml:
  expanded: false
  rolling_windows: [252, 504, 756]
  expanding: true
  embargo_intervals: 1
  macro_enabled: false
  alt_enabled: false
  alt_sleep_seconds: 1.0
