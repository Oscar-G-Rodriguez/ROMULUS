backtest:
  name: "ROMULUS Suite Default"
  start_date: "2010-01-01"
  end_date: "2024-12-31"
  initial_cash: 10000.0

universe:
  source: "configs/universe_default.json"

strategies:
  - name: "equal_weight"
    type: "equal_weight"
  - name: "cash_only"
    type: "cash_only"
  - name: "inv_vol"
    type: "inv_vol"
  - name: "ts_mom"
    type: "ts_mom"
  - name: "xsec_mom"
    type: "xsec_mom"
  - name: "vol_target"
    type: "vol_target"
  - name: "ml_risk_adjusted"
    type: "ml_risk_adjusted"
    params:
      model_family: "ridge"
      device: "cpu"

execution:
  decision_days: ["wednesday", "friday"]
  decision_time: "close"
  fill_time: "open"
  fractional_shares: true
  min_order_notional: 1.0
  cash_buffer_pct: 0.01
  max_weight: 0.35
  turnover_cap: 0.35

costs:
  commission_per_trade: 0.0
  slippage_bps: 5.0

data:
  source: "yfinance"
  cache_dir: "data/cache"
  adjustment: "split_and_dividend"

output:
  run_dir: "outputs/suite_runs"

warmup:
  enabled: true
  start_date: "2008-01-01"
  rebase: true

leaderboard:
  window: 20
  dd_limit: -0.2
  turnover_limit: 1.0

meta:
  enabled: false
  min_periods_before_selection: 4
  baseline_strategy: "equal_weight"
