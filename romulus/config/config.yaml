# Global configuration for Romulus V1.
# These values are read by most modules; avoid hardcoding paths or constants elsewhere.

paths:
  data: "data"
  raw: "data/raw"
  interim: "data/interim"
  processed: "data/processed"
  results: "data/results"
  registry: "data/registry"
  models: "data/models"

# Intervals the system prepares and may trade on.
# "1d" (daily), "1w" (weekly period ending Fri), "1m" (calendar month end)
timeframes: ["1d","2d","3d","5d","1w","2w","1m","2m"]


execution:
  # Signal → trade return mapping convention. For V1 we assume close->next-open fills.
  signal_delay: "close_to_next_open"
  # Keep some cash un-invested for slippage, fees, and deposits arriving between rebalances.
  cash_buffer_pct: 2.0
  # Ignore very small orders below this notional.
  min_ticket_usd: 50
  # Per-name max capital allocation.
  max_position_pct_nav: 0.05
  # Participation cap relative to ADV during sizing.
  max_adv_pct: 0.01
  # Whether to park idle cash in a cash ETF (e.g., SHV). V1 false.
  use_cash_sleeve_etf: false
  # Which cost model to load from config/cost_models/*.yaml
  cost_model_id: "v2_spread_vol_pr"

# Benchmark symbol for alpha calculations and comparisons.
benchmark: "SPY"   # Prefer total return variant if available; otherwise price-only.

risk:
  # Sector-level exposure cap (fraction of NAV).
  sector_cap: 0.20
  # Beta targeting for selection champion policies (default; tournament may override).
  beta_target: 0.20
  # Allowed drift around beta_target before hedging.
  beta_band: 0.10
  # Annualized volatility targeting for portfolio sizing routines.
  vol_target_ann: 0.15

params:
  # Reproducibility
  random_seed: 42
  # How often to retrain base models when in automated mode (tournament decides cadence).
  retrain_freq: "1W"
  # Global backtest window defaults (used by CLI and UI quick-runs).
  backtest_start: "2005-01-01"
  backtest_end: "2025-01-01"

# Default model-family hyperparameters used by modeling/train_models.py
model_defaults:
  type: "xgboost"
  xgboost:
    max_depth: 5
    eta: 0.05
    subsample: 0.7
    colsample_bytree: 0.7
    min_child_weight: 10
    lambda: 1.0
    alpha: 0.1
    n_estimators: 200
    objective: "reg:squarederror"
  lightgbm:
    num_leaves: 32
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.7
    n_estimators: 200
  random_forest:
    n_estimators: 200
    max_depth: 6
    min_samples_leaf: 10
