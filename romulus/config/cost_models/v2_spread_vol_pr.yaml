# More realistic cost model: spread + volatility impact + participation limits + borrow.
model_id: "v2_spread_vol_pr"

# Spread assumptions by liquidity bucket (A most liquid).
spread_bps_by_liquidity_bucket:
  A: 5
  B: 10
  C: 20
  D: 35

# Participation rate cap to bound fills as a fraction of ADV.
participation_rate_limit: 0.01

# Impact coefficient to scale slippage with realized volatility.
vol_impact_coef: 0.10

# Annualized borrow fee for short positions (simplified).
borrow_fee_short_annual_pct: 0.03

# Execution convention kept consistent with portfolio/execution modules.
signal_delay: "close_to_next_open"
