# Exploratory sweeps across anchors, horizons, CV windows, and models.
# The runner will create a cartesian product per row and log results to leaderboard.

grid:

  # Daily horizon sweeps (ridge) 
  - anchor: daily
    feature_blocks: [daily_1d, daily_5d, daily_10d]
    label_map:
      daily_1d:  daily_1d
      daily_5d:  daily_5d
      daily_10d: daily_10d
    model: ridge
    ridge_alpha: [0.5, 1.0, 2.0]
    train_mode: [rolling, expanding]
    train_window_months: [24, 36, 48]
    test_window_days: [5, 10, 20]
    purge_days: 3
    embargo_days: 3
    seed: [42]

  #  Daily horizon sweeps (xgb) 
  - anchor: daily
    feature_blocks: [daily_5d, daily_10d]
    label_map:
      daily_5d:  daily_5d
      daily_10d: daily_10d
    model: xgb
    xgb:
      n_estimators: [600, 900]
      learning_rate: [0.03, 0.06]
      max_depth: [5, 7]
      subsample: [0.8]
      colsample_bytree: [0.7, 0.9]
      tree_method: [hist]      # switch to gpu_hist if you enable GPU
      random_state: [42]
    train_mode: [rolling]
    train_window_months: [36, 48]
    test_window_days: [5, 20]
    purge_days: 3
    embargo_days: 3
    seed: [42]

  # Weekly anchor (ridge) 
  - anchor: weekly
    feature_blocks: [weekly_1w, weekly_4w]
    label_map:
      weekly_1w: weekly_1w
      weekly_4w: weekly_4w
    model: ridge
    ridge_alpha: [0.5, 1.0, 2.0]
    train_mode: [rolling]
    train_window_months: [24, 36]
    test_window_days: [5, 10]   # evaluation window on calendar days (still valid)
    purge_days: 3
    embargo_days: 3
    seed: [42]

selection:
  metric: rank_ic                  # used by leaderboard to prefer configs
  tie_breakers: [rmse, r2]
  promote_top_k: 3                 # number of candidates to keep for shadow tests
