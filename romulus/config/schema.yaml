# Feature and label schema declarations.
# The featuregen stage reads these, so you can add/remove indicators without changing code.

featuresets:
  tech_basic:
    timeframe: "1d"
    indicators:
      - {name: "sma_10", transform: "SMA", window: 10}
      - {name: "sma_20", transform: "SMA", window: 20}
      - {name: "rsi_14", transform: "RSI", window: 14}
      - {name: "vol_20", transform: "ROLLING_VOL", window: 20}

  tech_weekly:
    timeframe: "1w"
    indicators:
      - {name: "sma_4w", transform: "SMA", window: 4}
      - {name: "mom_4w", transform: "MOMENTUM", window: 4}
      - {name: "vol_8w", transform: "ROLLING_VOL", window: 8}

  fund_basic:
    timeframe: "1m"
    indicators:
      - {name: "pe_ttm", transform: "PE_TTM"}
      - {name: "pb_mrq", transform: "PB"}
      - {name: "roe_ttm", transform: "ROE_TTM"}

normalization:
  # Rolling normalization applied after feature computation (implemented leak-free).
  method: "rolling_z"
  window: 252

labels:
  # Forward-return label horizons. Featuregen/labeling will respect signal_delay conventions.
  horizons:
    - {name: "ret_2d",  horizon: "2d"}
    - {name: "ret_5d",  horizon: "5d"}
    - {name: "ret_10d", horizon: "10d"}
    - {name: "ret_4w",  horizon: "4w"}
    - {name: "ret_12w", horizon: "12w"}
    - {name: "ret_3m",  horizon: "3m"}      `
