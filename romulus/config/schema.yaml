# Defines data conventions and transformation rules.
global:
  anchor_frequencies: ["daily", "weekly"]
  adjustments:
    prices_adjusted: false         # we keep raw OHLCV; adjust in preprocess if needed
  units:
    returns: log
    costs: bps
  keys:
    - date
    - Ticker

raw:
  daily_prices:
    path_key: raw_daily
    columns: ["date","Open","High","Low","Close","Adj Close","Volume","Ticker"]
    dtype:
      date: datetime64[ns]
      Open: float64
      High: float64
      Low: float64
      Close: float64
      Adj Close: float64
      Volume: float64
      Ticker: string

interim:
  daily_panel:
    derived_columns:
      dollar_vol: "Close * Volume"

features:
  # For a daily-anchored, 5-day-horizon feature store
  daily_5d:
    anchor: daily
    include:
      - name: r1
        source: daily_prices
        transform: log_return_1d
      - name: ret_5
        source: daily_prices
        transform: log_return_nd
        params: {n: 5}
      - name: ret_10
        source: daily_prices
        transform: log_return_nd
        params: {n: 10}
      - name: vol_20
        source: daily_prices
        transform: rolling_std
        params: {col: r1, window: 20}
      - name: vol_60
        source: daily_prices
        transform: rolling_std
        params: {col: r1, window: 60}
      - name: SMA20
        source: daily_prices
        transform: rolling_mean
        params: {col: Close, window: 20}
      - name: SMA50
        source: daily_prices
        transform: rolling_mean
        params: {col: Close, window: 50}
      - name: RSI14
        source: daily_prices
        transform: rsi
        params: {window: 14}
      - name: mom20
        source: daily_prices
        transform: pct_change_n
        params: {col: Close, n: 20}
      - name: mom60
        source: daily_prices
        transform: pct_change_n
        params: {col: Close, n: 60}
      - name: dollar_vol
        source: interim.daily_panel
        passthrough: true

labels:
  daily_5d:
    anchor: daily
    definition:
      name: y_5
      type: forward_log_return
      params: {col: Close, horizon_days: 5}

resampling:
  daily_to_weekly:
    price_last: ["Close","Open","High","Low","Adj Close"]
    return_sum_log: ["r1"]
    vol_std: ["r1"]
    volume_sum: ["Volume"]

point_in_time:
  # For slow data (weekly/monthly/macro), define PIT joins using a release timestamp.
  columns:
    - name: release_ts
      dtype: datetime64[ns]
    - name: valid_from
      dtype: datetime64[ns]
    - name: valid_to
      dtype: datetime64[ns]
  join_rule:
    type: asof
    condition: release_ts <= asof_date
  add_age_days: true
