# Tournament and cadence settings for the champion–challenger system.

cadence:
  # Challengers get scored daily on new truth data.
  eval_update_freq: "1D"
  # Decision cutoff after market close (post print-settlement). Weekly cadence.
  decision_cutoff_weekday: "THU"
  decision_cutoff_time_et: "16:10"
  # Champions trade once per week at next open after cutoff.
  trade_day_weekday: "FRI"
  trade_session: "NEXT_OPEN"
  # Freeze champion choice between cutoff and trade to make promotions auditable.
  lock_promotion_until_trade: true

cv:
  # Purged, embargoed time-based CV defaults (implemented in labeling/time_cv.py)
  folds: 5
  embargo_days: 5

multiple_testing:
  # Tournament-level multiple testing controls (used in evaluation/selection_tests.py)
  method: "SPA"
  alpha: 0.10

selection_tournament:
  # How often to sweep selection policies (beta/vol caps, rank→weight, etc.)
  eval_freq: "3M"
  promote_margin:
    # Minimum performance edge required vs current selection champion.
    min_delta_sharpe: 0.15
    min_alpha_t: 2.0
    # Require consistent wins across consecutive windows to avoid flip-flops.
    hysteresis_windows: 2
  policy_grid:
    beta_target: [0.0, 0.1, 0.2, 0.35, 0.5, 0.75, 1.0]
    beta_band: [0.03, 0.05, 0.10]
    vol_target_ann: [0.10, 0.12, 0.15, 0.18]
    sector_cap: [0.10, 0.15, 0.20, 0.25]
    max_position_pct_nav: [0.02, 0.03, 0.05]
    turnover_pa_cap: [2.0, 4.0, 6.0, 10.0]
    rank_to_weight: ["linear", "top_k_equal_25", "top_k_equal_50"]
    cash_buffer_pct: [0.0, 0.01, 0.02]


modeling:
  target: "y_alpha_p1"
  families: ["RF", "XGB", "LGB", "EN"]
  search:
    strategy: "grid"        # "grid" or "random"
    max_trials: 12          # only used for random
    random_state: 42
  grids:
    RF:
      n_estimators: [200, 400, 800]
      max_depth: [null, 10, 20]
      min_samples_leaf: [1, 2, 5]
    XGB:
      n_estimators: [400, 800]
      max_depth: [4, 6, 8]
      learning_rate: [0.03, 0.05, 0.1]
      subsample: [0.6, 0.8]
      colsample_bytree: [0.6, 0.8]
    LGB:
      n_estimators: [600, 1000]
      num_leaves: [31, 63]
      learning_rate: [0.03, 0.05, 0.1]
      subsample: [0.7, 0.9]
      colsample_bytree: [0.7, 0.9]
    EN:
      alpha: [0.0003, 0.001, 0.003, 0.01]
      l1_ratio: [0.05, 0.25, 0.5, 0.75]
  n_jobs: -1

