# Seed universe so the repo runs out-of-the-box.
# src/ingest/build_universe.py will regenerate this with PIT membership and metadata.

universe:
  provider: "yahoo"
  include_delisted: true
  min_price: 2.0
  min_mktcap_usd: 500000000
  min_adv_20: 1000000
  ipo_exclusion_days: 60
  tickers:
    - SPY
    - AAPL
    - MSFT
    - AMZN
    - GOOGL
    - META
    - NVDA
    - TSLA
