meta:
  version: 2.2

defaults:
  enabled: true
  timezone: "America/New_York"
  currency: "USD"
  weekly_calendar: "XNYS"
  cache_dir: "projects/default/artifacts/datasets/cache"
  pit_enforce: true

# ── Identity / Governance ───────────────────────────────────────────
identity:
  symbol_map:
    enabled: true
    source: local_csv
    path: projects/default/resources/symbol_map.parquet
    schema: [symbol, perm_id, cik, exchange, first_date, last_date]

  adr_map:
    enabled: true
    source: local_csv
    path: projects/default/resources/adr_map.parquet
    schema: [perm_id, primary_symbol, alt_symbols, primary_ccy, alt_ccys]

  delist_table:
    enabled: true
    source: local_csv
    path: projects/default/resources/delist_table.parquet
    schema: [perm_id, symbol, event_date, event_type, tender_price]

  sector_map:
    enabled: true
    source: yahoo_fin
    snapshot: weekly
    path: projects/default/resources/sector_map.parquet
    schema: [perm_id, symbol, sector, industry, asof]

  index_membership:
    enabled: true
    source: yahoo_fin
    indices: ["SP500","NASDAQ100"]
    snapshot: weekly
    path: projects/default/resources/index_membership.parquet
    schema: [index, perm_id, symbol, in_index, asof]

  calendars_holidays:
    enabled: true
    source: pandas_market_calendars
    exchange: XNYS

  fx_rates:
    enabled: true
    source: fred
    series: ["DEXJPUS","DEXUSEU","DEXUSUK","DTWEXBGS"]
    frequency: daily

calendar_policy:
  master_calendar: XNYS
  week_close_time: "Friday 16:00 America/New_York"
  align_overseas: use_latest_before_master_close
  fx_normalize_alt_listings: true
  macro_release_cutoff: "<= master_close"

# ── Tier 1 — Market Core (raw) ─────────────────────────────────────
tier1_market_core:
  price_ohlcv:
    enabled: true
    source: yfinance
    symbols: "NASDAQ,NYSE,AMEX"
    fields: [open, high, low, close, volume]
    frequency: daily
    adjust: true
  adj_close:
    enabled: true
    source: yfinance
    field: adj_close
    frequency: daily
  shares_out:
    enabled: true
    source: sec_edgar
    filings: ["10-Q","10-K"]
    frequency: quarterly
    pit_lag: "1Q"
  mcap:
    enabled: true
    source: derived
    formula: "close * shares_out"
    frequency: daily
  corp_actions:
    enabled: true
    source: yfinance
    fields: [splits, dividends]
    frequency: event

# ── Tier 2 — Macro / Cross-Asset (raw) ─────────────────────────────
tier2_macro_cross:
  macro_cpi:       {enabled: true, source: fred, series: CPIAUCSL,  frequency: monthly,   pit_lag: "1M"}
  macro_unrate:    {enabled: true, source: fred, series: UNRATE,    frequency: monthly,   pit_lag: "1M"}
  macro_gdp:       {enabled: true, source: fred, series: GDPC1,     frequency: quarterly, pit_lag: "1Q"}
  rate_10y:        {enabled: true, source: fred, series: DGS10,     frequency: daily}
  rate_2y:         {enabled: true, source: fred, series: DGS2,      frequency: daily}
  term_spread:     {enabled: true, source: derived, formula: "rate_10y - rate_2y"}
  credit_spread:   {enabled: true, source: fred, series: "BAA10YM - AAA10YM", frequency: daily}
  dxy_index:       {enabled: true, source: fred, series: DTWEXBGS,  frequency: daily}
  wti_crude:       {enabled: true, source: fred, series: DCOILWTICO,frequency: daily}
  gold_price:      {enabled: true, source: fred, series: GOLDAMGBD228NLBM, frequency: daily}
  vix_index:       {enabled: true, source: yfinance, symbol: "^VIX",  frequency: daily}
  move_index:      {enabled: true, source: yfinance, symbol: "^MOVE", frequency: daily}
  global_eq:
    enabled: true
    source: yfinance
    symbols: ["^N225","^HSI","^STOXX50E","^GDAXI"]
    frequency: daily
  yield_curve_state: {enabled: true, source: derived, formula: "categorize(term_spread, cut=[-inf,0,0.5,inf])"}
  recession_nowcast: {enabled: true, source: derived, formula: "logit(term_spread, PMI, UNRATE)"}

# ── Tier 3 — Fundamentals (PIT) ────────────────────────────────────
tier3_fundamentals:
  fund_eps:           {enabled: true, source: sec_edgar, field: EPS,          frequency: quarterly, pit_lag: "1Q"}
  fund_rev:           {enabled: true, source: sec_edgar, field: Revenue,      frequency: quarterly, pit_lag: "1Q"}
  fund_debt_equity:   {enabled: true, source: sec_edgar, field: DebtToEquity, frequency: quarterly, pit_lag: "1Q"}
  fund_cash_assets:   {enabled: true, source: sec_edgar, field: CashToAssets, frequency: quarterly, pit_lag: "1Q"}
  fund_roe:           {enabled: true, source: derived,  formula: "NetIncome/Equity", frequency: quarterly, pit_lag: "1Q"}
  val_pe:             {enabled: true, source: derived,  formula: "Price/EPS",       frequency: weekly}
  val_pb:             {enabled: true, source: derived,  formula: "Price/Book",      frequency: weekly}
  val_ev_ebitda:      {enabled: true, source: derived,  formula: "EV/EBITDA",       frequency: weekly}
  fund_div_yield:     {enabled: true, source: derived,  formula: "Dividend/Price",  frequency: weekly}
  earnings_calendar:  {enabled: true, source: yahoo_fin, field: earningsDate,       frequency: event}

# ── Tier 7 — Alt/Structural/Meta  ────────────────────────
tier7_alt_struct_meta:
  alt_sent_news:     {enabled: false, source: finbert_local, pipeline: "headline_sentiment_mean_7d"}
  alt_trend_score:   {enabled: false, source: pytrends, queries: ["stock market","NASDAQ"], frequency: weekly}
  struct_index_weight:
    enabled: true
    source: yahoo_fin
    indices: ["SP500","NASDAQ100"]
  struct_earnings_flag:
    enabled: true
    source: yahoo_fin
    field: hasEarningsThisWeek
  meta_feature_drift: {enabled: true, source: local, metric: PSI}
  exec_spread_live:   {enabled: false, source: broker_api, field: avg_spread}
  exec_cost_live:     {enabled: false, source: broker_api, field: effective_cost}
  alt_crypto_px:      {enabled: false, source: yfinance, symbol: "BTC-USD"}
  alt_weather_event:  {enabled: false, source: NOAA, field: hurricane_activity_index}

# ── Derived families (expanded by features pipeline) ────────────────
derived_families:
  returns:
    - {name: ret_log, formula: "ln(C_t/C_{t-1})"}

  volatility:
    - {name: vol_roll,          formula: "rolling_std(r,20)"}
    - {name: vol_ewma,          formula: "ewm(r,lambda=0.94)"}
    - {name: vol_realized,      formula: "sqrt(sum(r^2)/h)"}
    - {name: vol_of_vol,        formula: "rolling_std(vol)"}
    - {name: vol_parkinson,     formula: "Parkinson(H,L)"}
    - {name: vol_garman_klass,  formula: "GarmanKlass(O,H,L,C)"}
    - {name: vol_yang_zhang,    formula: "YangZhang(O,H,L,C,prevC)"}
    - {name: downside_vol,      formula: "std(min(r,0))"}
    - {name: atr,               formula: "AverageTrueRange(H,L,C,n=14)"}
    - {name: vol_garch,         formula: "arch.GARCH(1,1)", enabled: false}

  momentum:
    - {name: mom_ema,      formula: "EMA12/EMA26 - 1"}
    - {name: mom_roc,      formula: "C_t/C_{t-10} - 1"}
    - {name: mom_fracdiff, formula: "ffd_fixed_width(d)", params: {d: [0.30,0.45,0.60]}}

  liquidity:
    - {name: dollar_volume, formula: "P*V"}
    - {name: liq_turnover,  formula: "dollar_traded/AUM"}
    - {name: liq_amihud,    formula: "|r|/dollar_volume"}

  cost_proxies:
    - {name: roll_spread,           formula: "RollImpliedSpread(r)"}
    - {name: corwin_schultz_spread, formula: "CorwinSchultz(H,L)"}

  correlation:
    - {name: corr_sector,   formula: "corr(r_i, r_sector)"}
    - {name: corr_ewma,     formula: "ewm_corr(r_i, r_sector, lambda=0.94)"}
    - {name: corr_spearman, formula: "spearman_corr(r_i, r_sector)"}

  covariance:
    - {name: cov_lw,   formula: "LedoitWolfShrinkage"}
    - {name: cov_ewma, formula: "exp_weighted_cov"}

  interstock:
    - {name: pca_load,     formula: "PCA eigen-loadings (randomized)"}
    - {name: leadlag_corr, formula: "corr(r_i, r_sector(t-1))"}

  cointegration:
    - {name: cointegr_resid,     formula: "Engle-Granger residual z (stock vs sector ETF)", pval: 0.05}
    - {name: cointegr_half_life, formula: "-ln(2)/ln(1+beta_AR1)"}
    - {name: cointegr_macro,     formula: "Engle-Granger stock vs macro (DXY/WTI)"}

  change_detection:
    - {name: cusum_stat,         formula: "Σ(max(0, x_t − mean − h))"}
    - {name: explosiveness_flag, formula: "right-tail unit-root flag"}

  entropy:
    - {name: entropy_plugin, formula: "plug_in_entropy(r, bins=20, window=26w)"}
    - {name: entropy_lz,     formula: "lempel_ziv_entropy(sign(r), window=26w)"}

  systemic:
    - {name: breadth,     formula: "% advancers"}
    - {name: cross_disp,  formula: "cross-sectional std(r)"}

# ── Labels / Weights ───────────────────────────────────────────────
labels:
  lbl_ret1w:           {type: regression, formula: "ln(C_{t+1}/C_t)"}
  lbl_ret2w:           {type: regression, formula: "ln(C_{t+2}/C_t)"}
  lbl_triple_barrier:
    type: classification
    method: triple_barrier
    params: {pt_sigma: 1.5, sl_sigma: 1.0, horizon_days: 5, sigma_source: vol_ewma}
  lbl_meta:            {type: classification, method: meta_label}
  lbl_realized_vol:    {type: regression, formula: "std(r_{t:t+h})"}
  lbl_drawdown:        {type: regression, formula: "1 - P_t/max(P)"}

weights:
  uniqueness:   {enabled: true, method: AFML_uniqueness}
  time_decay:   {enabled: true, half_life_weeks: 52}
  class_weight: {enabled: true}

# ── Runtime guards ─────────────────────────────────────────────────
guards:
  winsorize:        {enabled: true, lower_q: 0.005, upper_q: 0.995}
  freshness_days:   5
  min_coverage_1y:  0.60
  price_floor_usd:  3.0
  adv_floor_usd:    2000000
  use_alt_listings_to_fill_gaps: true
  avoid_double_count_alt_volume: true

# ── Delist & Tender policy ─────────────────────────────────────────
delist_policy:
  write_off_on_delist: true
  tender_use_cash_price_if_available: true
  soft_markdown_weeks: 2          # optional: linearly to zero across N weeks before delist

