meta:
  version: 1
  notes: "Logical vs experimental frequency settings; per-family aggregation; per-model grids."

# 1) Baseline experimental frequency for the whole pipeline
default_profile:
  # This is the single baseline every model inherits from unless they override.
  experimental_freq: weekly     # global freq delivered to the model
  horizon_days: 5               # label timeout must be coherent with freq
  families:
    prices_derived:             # returns/vol/momentum/liquidity/cost_proxies/etc.
      use_from: daily           # logical freq used to build these
      aggregate_to: weekly
      policy:
        returns: last           # last cumulative weekly log-return
        volatility: vol_from_dailies   # build from daily into weekly
        momentum: end_value     # compute momentum daily; take week-end value
        liquidity: sum_dollar   # sum(P*V) for the week
        cost_proxies: end_value # spread estimators at week-end
    interstock:
      use_from: daily
      aggregate_to: weekly
      policy:
        pca_load: end_value
        leadlag_corr: mean
    cointegration:
      use_from: daily
      aggregate_to: weekly
      policy:
        cointegr_resid: end_value
        cointegr_half_life: end_value
    systemic:
      use_from: daily
      aggregate_to: weekly
      policy:
        breadth: mean
        cross_disp: mean
    macro:
      use_from: monthly         # logical
      upsample_to: weekly
      policy:
        fill: locf_pit          # last observation carried forward with PIT lag
        transform: zscore_2y
    fundamentals:
      use_from: quarterly
      upsample_to: weekly
      policy:
        fill: locf_pit
        transform: rolling_standardize_2y
    entropy_change:
      use_from: daily
      aggregate_to: weekly
      policy:
        entropy_plugin: mean
        entropy_lz: mean
        cusum_stat: max         # peak stress within the week
        explosiveness_flag: any # OR over the week

# 2) Per-model frequency grids to try (on top of the default_profile)
model_profiles:
  lgbm_cls:
    experimental_freq_grid: [daily, 3d, weekly]     # 3d = 3-business-day bar
    overrides:
      prices_derived:
        aggregate_to_grid: [daily, 3d, weekly]
      interstock:
        aggregate_to_grid: [weekly]
      macro:
        upsample_to_grid: [weekly]                  # macro remains monthly logically
      fundamentals:
        upsample_to_grid: [weekly]
  xgb_cls:
    experimental_freq_grid: [weekly, biweekly]
    overrides:
      prices_derived:
        aggregate_to_grid: [weekly, biweekly]
      macro:
        upsample_to_grid: [weekly, biweekly]
      fundamentals:
        upsample_to_grid: [weekly, biweekly]
  rf_cls:
    experimental_freq_grid: [weekly]
    overrides:
      prices_derived:
        aggregate_to_grid: [weekly]
      macro:
        upsample_to_grid: [weekly]
      fundamentals:
        upsample_to_grid: [weekly]

# 3) Implementation knobs (so the builder knows exact formulas)
methods:
  aggregation:
    last: "take last within period (end-of-bar)"
    mean: "arithmetic mean within period"
    sum_dollar: "sum of price*volume over period"
    end_value: "compute daily then take last value"
    vol_from_dailies: "build vol estimators from daily returns within the period"
    any: "boolean OR across period"
    max: "max across period"
  upsampling:
    locf_pit: "last observation carried forward with release-lag enforcement"
  transforms:
    zscore_2y: "z-score using a rolling 2-year window"
    rolling_standardize_2y: "demean/std using 2-year rolling window"

# 4) Compute limits (1660Ti + i7 safeguards)
limits:
  max_freq_combos_per_model: 3        # guardrail for grid explosion
  cache_by: ["experimental_freq", "family", "ticker", "week"]
