[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "romulus"
version = "0.0.1"
description = "ROMULUS — weekly, AFML-complete, dollar-denominated trading research stack"
requires-python = ">=3.10"
authors = [{name="Romulus", email="dev@romulus.local"}]
readme = "README.md"
dependencies = [
  "pydantic>=2.6",
  "click>=8.1",
  "tqdm>=4.66",
  "numpy>=1.26",
  "pandas>=2.2",
  "polars>=1.6",
  "pyarrow>=16.0",
  "joblib>=1.4",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "hmmlearn>=0.3",
  "numba>=0.59",
  "lightgbm>=4.3",
  "xgboost>=2.0",
  "yfinance>=0.2",
  "pandas-datareader>=0.10",
  "pandas-market-calendars>=4.4",
  "python-dateutil>=2.9",
  "requests>=2.32"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["romulus_core*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E","F","I","B"]

